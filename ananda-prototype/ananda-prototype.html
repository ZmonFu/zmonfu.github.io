/* ── SHARED COMPONENTS ──────────────────────────────────────────────────── */
const Sec=({label})=><p style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",color:"#777",margin:"12px 0 6px"}}>{label}</p>;

function Dropdown({value,onChange,options}){
  return(
    <div style={{position:"relative"}}>
      <select value={value} onChange={e=>onChange(e.target.value)} style={{width:"100%",background:WH,border:"1px solid #ddd",borderRadius:10,padding:"10px 36px 10px 12px",fontSize:12,color:"#333",appearance:"none",cursor:"pointer",outline:"none",fontFamily:"inherit"}}>
        {options.map(([v,l])=><option key={v} value={v}>{l}</option>)}
      </select>
      <div style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}><ChevD/></div>
    </div>
  );
}

function Stars({n=4,max=5,sz=12}){
  return <div style={{display:"flex",gap:2}}>{Array.from({length:max},(_,i)=>i<n?<StarF key={i} sz={sz}/>:<StarE key={i} sz={sz}/>)}</div>;
}

function Barcode(){
  const bars=[3,1,2,1,1,3,1,2,1,3,2,1,1,2,1,3,1,1,2,3,1,2,1,1,3,1,2,2,1,3];
  return <div style={{display:"flex",gap:1.5,height:32,alignItems:"stretch"}}>{bars.map((w,i)=><div key={i} style={{width:w*2,background:"#111",borderRadius:1}}/>)}</div>;
}

function PhotoBanner({color,label,h=110}){
  return(
    <div style={{height:h,background:`linear-gradient(135deg,${color}cc,${color})`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",borderRadius:14,marginBottom:12}}>
      <CamI sz={30}/><p style={{fontSize:10,color:"rgba(255,255,255,0.35)",margin:"6px 0 0"}}>Foto: {label}</p>
    </div>
  );
}

function ECard({e,faved,onFave,onClick}){
  const openT=e.retailer?NORA_TASKS.filter(t=>!t.assignee&&t.type==="community").length:0;
  return(
    <button onClick={onClick} style={{width:"100%",textAlign:"left",background:WH,borderRadius:14,padding:"12px 14px",marginBottom:8,border:"none",cursor:"pointer",display:"block",boxSizing:"border-box",position:"relative"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",color:RC}}>{e.sport}</span>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {e.retailer&&<span style={{background:HL,borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:700,color:"#111"}}>Karma</span>}
          {onFave&&<button onClick={ev=>{ev.stopPropagation();onFave(e.id);}} style={{background:"none",border:"none",cursor:"pointer",padding:2,display:"flex",alignItems:"center"}}>{faved?<HeartF sz={16}/>:<HeartO sz={16}/>}</button>}
        </div>
      </div>
      <p style={{fontWeight:700,fontSize:15,color:"#111",margin:"0 0 3px",lineHeight:1.25}}>{e.title}</p>
      <p style={{fontSize:11,color:"#888",margin:"0 0 6px"}}>{e.location}</p>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:11,color:"#888"}}>{e.date} · {e.time} · {e.recurring}</span>
        {openT>0&&<span style={{fontSize:10,fontWeight:700,background:"#111",color:HL,borderRadius:20,padding:"2px 8px"}}>{openT} offen</span>}
      </div>
    </button>
  );
}

function AppHdr({persona,onBack,onFab,onNotif,notifBadge,canCreate=true,subLabel,onSubLabel,onInfo,onMsg}){
  const P={nora:{name:"Nora",karma:145},kuno:{name:"Kuno",karma:null},angelina:{name:"Angelina",karma:312}};
  const p=P[persona];
  return(
    <div style={{background:BG,padding:"10px 14px 6px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexShrink:0,position:"sticky",top:0,zIndex:10}}>
      {onBack
        ?<button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,lineHeight:1,color:"#111",fontWeight:300,padding:"2px 4px"}}>←</button>
        :<div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontWeight:700,fontSize:18,color:"#111",lineHeight:1}}>{p.name}</span>
            {p.karma!=null&&<span style={{background:HL,borderRadius:20,padding:"1px 8px",fontSize:12,fontWeight:700,color:"#111"}}>{p.karma} Karma</span>}
          </div>
          {subLabel&&<button onClick={onSubLabel} style={{background:"none",border:"none",cursor:"pointer",padding:"2px 0 0",fontSize:11,color:persona==="kuno"?RC:CC,fontWeight:600,display:"block"}}>{subLabel} →</button>}
        </div>
      }
      <div style={{display:"flex",gap:7,alignItems:"center",marginLeft:"auto"}}>
        {canCreate&&persona!=="nora"&&<button onClick={onFab} style={{width:34,height:34,background:"#111",borderRadius:"50%",color:WH,fontSize:20,fontWeight:300,display:"flex",alignItems:"center",justifyContent:"center",border:"none",cursor:"pointer",flexShrink:0}}>+</button>}
        {/* Combined notifications + messages */}
        <button onClick={()=>onMsg?onMsg():onNotif&&onNotif()} style={{position:"relative",width:34,height:34,background:WH,border:"1px solid #ccc",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
          <Bell sz={18}/>
          {notifBadge&&<span style={{position:"absolute",top:-4,right:-4,width:15,height:15,background:HL,borderRadius:"50%",fontSize:8,fontWeight:700,color:"#111",display:"flex",alignItems:"center",justifyContent:"center"}}>{notifBadge}</span>}
        </button>
        {/* Gear / Einstellungen */}
        <button onClick={()=>{}} style={{width:34,height:34,background:WH,border:"1px solid #ccc",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
          <GearI sz={16}/>
        </button>
      </div>
    </div>
  );
}

function EventDetailHdr({e}){
  const PART_NAMES=["Nora","Max","Sara","Tom","Julia","Felix","Anna","Leo","Mia","Paul","Lena","Jonas","Eva","Kai","Lara","Tim"];
  const n=Math.min(e.participants||6,PART_NAMES.length);
  const shown=PART_NAMES.slice(0,Math.min(n,6));
  const extra=n-shown.length;
  const colors=["#7776BC","#310959","#888","#4a90d9","#e67e22","#27ae60","#c0392b","#8e44ad"];
  return(
    <div style={{margin:"8px 14px",background:WH,borderLeft:`4px solid ${RC}`,borderRadius:10,padding:"12px 12px"}}>
      <p style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",color:RC,margin:"0 0 3px"}}>{e.sport}</p>
      <p style={{fontWeight:700,fontSize:16,color:"#111",margin:"0 0 8px",lineHeight:1.25}}>{e.title}</p>
      {[
        [e.date+" · "+e.recurring,"Datum"],
        [e.time+" Uhr","Uhrzeit"],
        [e.location,"Ort"],
        [(e.distance||"")+(e.pace?" · "+e.pace:"")+" · "+e.character,"Richtwerte"],
      ].map(([val,lbl],i)=>(
        <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:i<3?"1px solid #f2f2f2":"none"}}>
          <p style={{fontSize:12,color:"#333",margin:0}}>{val}</p>
          {lbl&&<p style={{fontSize:10,color:"#aaa",margin:0,alignSelf:"center"}}>{lbl}</p>}
        </div>
      ))}
      {/* Participant avatars */}
      <div style={{marginTop:10,paddingTop:8,borderTop:"1px solid #f2f2f2"}}>
        <p style={{fontSize:10,color:"#aaa",margin:"0 0 7px",fontWeight:600}}>Teilnehmer:innen · {n}</p>
        <div style={{display:"flex",alignItems:"center",gap:0}}>
          {shown.map((name,i)=>(
            <div key={name} title={name} style={{width:28,height:28,borderRadius:"50%",background:colors[i%colors.length],border:"2px solid #fff",marginRight:-6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:WH,flexShrink:0,zIndex:shown.length-i}}>
              {name[0]}
            </div>
          ))}
          {extra>0&&<div style={{width:28,height:28,borderRadius:"50%",background:"#bbb",border:"2px solid #fff",marginLeft:2,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:WH,flexShrink:0}}>+{extra}</div>}
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:7}}>
          {shown.map((name,i)=>(
            <span key={name} style={{fontSize:10,color:"#666"}}>{name}{i<shown.length-1?",":" "+( extra>0?`+${extra} weitere`:"")}</span>
          ))}
        </div>
      </div>
      <p style={{fontSize:11,color:RC,fontWeight:500,margin:"7px 0 0",lineHeight:1.5}}>{e.desc}</p>
    </div>
  );
}

/* ── MAIN COMPONENT ─────────────────────────────────────────────────────── */

  const[block2v,setB2]=useState("A");    // Kontrolle variant for Block 2
  const[kunoRec,setKR]=useState("weekly-tue");
  const[kunoGroup,setKG]=useState([]);
  const[ownersK,setOK]=useState(()=>{const o={};TMPLS_KUNO.forEach(t=>{o[t.id]=t.def;});return o;});
  const[ownersA,setOA]=useState(()=>{const o={};TMPLS_A.forEach(t=>{o[t.id]=t.def;});return o;});
  const[taskKarma,setTK]=useState(()=>{const k={};TMPLS_KUNO.forEach(t=>{k[t.id]=t.karma;});return k;});
  const[dynK,setDynK]=useState(false);
  const[bTaken,setBT]=useState(false);  // Run bewerben taken
  const[aTaken,setAT]=useState(false);  // Aufwärmen taken
  const[faved,setFaved]=useState({});
  const[walletOpen,setWO]=useState(false);
  const[aRecurring,setAR]=useState("monthly");
  const[autoAssign,setAA]=useState("confirm_unknown");
  const[bNotifShown,setBNS]=useState(false);
  const[evtExpanded,setEE]=useState(false);
  const[activeStep,setActiveStep]=useState(null);

  const go=s=>{setS(s);};
  const swP=p=>{setP(p);setS("home");setBT(false);setAT(false);setWO(false);setBNS(false);setEE(false);setActiveStep(null);};

          <button onClick={()=>go("a-create-2")} style={{width:"100%",background:"#111",color:WH,fontWeight:600,fontSize:13,padding:"13px 0",borderRadius:12,border:"none",cursor:"pointer"}}>Tasks auswählen</button>
        </div>
      </div>
    );

    /* ANGELINA: ERSTELLEN 2/2 (no retailer tasks) */
    if(screen==="a-create-2") return(
      <div style={{flex:1,overflowY:"auto"}}>
        <AppHdr persona="angelina" onBack={()=>go("a-create-1")} onNotif={()=>{}} canCreate={false} onInfo={infoAct}/>
        <div style={{padding:"10px 14px 100px"}}>
          <p style={{fontWeight:700,fontSize:14,color:"#111",margin:"0 0 10px"}}>Erstellen 2/2 — Tasks</p>
          <p style={{fontSize:12,color:"#888",margin:"0 0 10px"}}>Kein Händler beteiligt — Plattform-Treffpunkt offen.</p>
          <div style={{background:WH,borderRadius:14,overflow:"hidden",marginBottom:10}}>
            {TMPLS_A.map((t,i)=>{
              const own=ownersA[t.id];
              return(
                <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"11px 14px",borderBottom:i<TMPLS_A.length-1?"1px solid #eee":"none"}}>
                  <div style={{flex:1}}><p style={{fontSize:13,color:"#111",margin:0}}>{t.label}</p>{t.karma>0&&<p style={{fontSize:10,color:"#aaa",margin:"2px 0 0"}}>+{t.karma} Karma</p>}</div>
                  <div style={{display:"flex",borderRadius:10,overflow:"hidden",border:"1px solid #ddd",flexShrink:0}}>
                    <button onClick={()=>toggleOA(t.id)} style={{padding:"5px 10px",fontSize:11,fontWeight:700,border:"none",cursor:"pointer",background:own==="self"?HL:"#f5f5f5",color:own==="self"?"#111":"#aaa"}}>Ich</button>
                    <button onClick={()=>toggleOA(t.id)} style={{padding:"5px 10px",fontSize:11,fontWeight:700,border:"none",cursor:"pointer",background:own==="community"?HL:"#f5f5f5",color:own==="community"?"#111":"#aaa"}}>Community</button>
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{background:WH,borderRadius:14,padding:"12px 14px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <p style={{fontSize:12,color:"#888",margin:0}}>Händler-Kooperation hinzufügen?</p>
            <button onClick={()=>go("a-coop")} style={{background:RC,color:WH,border:"none",borderRadius:10,padding:"7px 12px",fontSize:11,fontWeight:600,cursor:"pointer",flexShrink:0}}>Kooperation →</button>
          </div>
          <button onClick={()=>go("a-home-ev1")} style={{width:"100%",background:"#111",color:WH,fontWeight:600,fontSize:13,padding:"13px 0",borderRadius:12,border:"none",cursor:"pointer"}}>Event veröffentlichen</button>
        </div>
      </div>
    );

    /* ANGELINA: KOOPERATION 1/2 */
    if(screen==="a-coop") return(
      <div style={{flex:1,overflowY:"auto"}}>
        <AppHdr persona="angelina" onBack={()=>go("a-create-2")} onNotif={()=>{}} canCreate={false} onInfo={infoAct}/>
        <div style={{padding:"10px 14px 100px"}}>
          <p style={{fontWeight:700,fontSize:14,color:"#111",margin:"0 0 4px"}}>Kooperation 1/2</p>
          <p style={{fontSize:12,color:"#888",margin:"0 0 14px"}}>Ergänze dein Event um einen Händler als Partner. Er stellt Raum bereit — deine Community sammelt Karma.</p>
          <div style={{background:HL,borderRadius:14,padding:"14px",marginBottom:14}}>
            <p style={{fontWeight:700,fontSize:13,color:"#111",margin:"0 0 6px"}}>Was passiert?</p>
            <p style={{fontSize:12,color:"#333",margin:0,lineHeight:1.6}}>Der Händler erhält eine Anfrage. Bei Bestätigung wird ein Task „Treffpunkt öffnen & bereitstellen" für ihn erstellt. Deine Community sammelt dann Karma für dieses Event.</p>
          </div>
          <button onClick={()=>go("a-invite")} style={{width:"100%",background:RC,color:WH,fontWeight:600,fontSize:13,padding:"13px 0",borderRadius:12,border:"none",cursor:"pointer",marginBottom:8}}>Händler:in auswählen →</button>
          <button onClick={()=>go("a-create-2")} style={{width:"100%",background:"transparent",border:"1px solid #ccc",color:"#666",fontWeight:500,fontSize:13,padding:"11px 0",borderRadius:12,cursor:"pointer"}}>Ohne Kooperation weiter</button>
        </div>
      </div>
    );

    /* ANGELINA: HÄNDLER EINLADEN */
    if(screen==="a-invite") return(
      <div style={{flex:1,overflowY:"auto"}}>
        <AppHdr persona="angelina" onBack={()=>go("a-coop")} onNotif={()=>{}} canCreate={false} onInfo={infoAct}/>
        <div style={{padding:"10px 14px 100px"}}>
          <p style={{fontSize:12,color:"#666",margin:"0 0 12px"}}>Wähle einen Laden als Treffpunkt.</p>
          {[{name:"Händler K",loc:"Dornbirn",ev:12,active:true},{name:"Händler A",loc:"Bregenz",ev:7},{name:"Händler B",loc:"Hard",ev:3}].map(s=>(
            <button key={s.name} onClick={()=>go("a-coop-tasks")} style={{width:"100%",textAlign:"left",marginBottom:8,borderRadius:14,padding:"12px 14px",border:s.active?`2px solid ${RC}`:"1px solid #eee",cursor:"pointer",background:s.active?"#f8f5fa":WH,boxSizing:"border-box"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div><p style={{fontWeight:600,fontSize:13,color:"#111",margin:0}}>{s.name}</p><p style={{fontSize:11,color:"#888",margin:"2px 0 0"}}>{s.loc} · {s.ev} Events</p></div>
                {s.active&&<span style={{background:RC,color:WH,fontSize:10,fontWeight:700,borderRadius:20,padding:"2px 10px"}}>Ausgewählt</span>}
              </div>
            </button>
          ))}
        </div>
      </div>
    );

    /* ANGELINA: KOOPERATION TASKS */
    if(screen==="a-coop-tasks") return(
      <div style={{flex:1,overflowY:"auto"}}>
        <AppHdr persona="angelina" onBack={()=>go("a-invite")} onNotif={()=>{}} canCreate={false} onInfo={infoAct}/>
        <div style={{padding:"10px 14px 100px"}}>
          <p style={{fontWeight:700,fontSize:14,color:"#111",margin:"0 0 4px"}}>Tasks mit Kooperation</p>
          <p style={{fontSize:12,color:"#888",margin:"0 0 12px"}}>Händler K wird angefragt. Sobald er bestätigt, erscheint sein Task automatisch.</p>
          <div style={{background:WH,borderRadius:14,overflow:"hidden",marginBottom:12}}>
            {/* Retailer task */}
            <div style={{display:"flex",alignItems:"center",padding:"11px 14px",borderBottom:"1px solid #eee",gap:8}}>
              <p style={{flex:1,fontSize:13,color:"#aaa",margin:0}}>Treffpunkt öffnen & bereitstellen</p>
              <button style={{background:`${RC}15`,border:`1px solid ${RC}30`,borderRadius:20,padding:"3px 10px",fontSize:10,color:RC,fontWeight:600,cursor:"pointer",flexShrink:0}}>Händler K angefragt</button>
            </div>
            {/* Community tasks */}
            {TMPLS_A.map((t,i,arr)=>{
              const own=ownersA[t.id];
              return(
                <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"11px 14px",borderBottom:i<arr.length-1?"1px solid #eee":"none"}}>
                  <div style={{flex:1}}><p style={{fontSize:13,color:"#111",margin:0}}>{t.label}</p>{t.karma>0&&<p style={{fontSize:10,color:"#aaa",margin:"2px 0 0"}}>+{t.karma} Karma</p>}</div>
                  <div style={{display:"flex",borderRadius:10,overflow:"hidden",border:"1px solid #ddd",flexShrink:0}}>
                    <button onClick={()=>toggleOA(t.id)} style={{padding:"5px 10px",fontSize:11,fontWeight:700,border:"none",cursor:"pointer",background:own==="self"?HL:"#f5f5f5",color:own==="self"?"#111":"#aaa"}}>Ich</button>
                    <button onClick={()=>toggleOA(t.id)} style={{padding:"5px 10px",fontSize:11,fontWeight:700,border:"none",cursor:"pointer",background:own==="community"?HL:"#f5f5f5",color:own==="community"?"#111":"#aaa"}}>Community</button>
                  </div>
                </div>
              );
            })}
          </div>
          <button onClick={()=>go("a-home-ev2")} style={{width:"100%",background:"#111",color:WH,fontWeight:600,fontSize:13,padding:"13px 0",borderRadius:12,border:"none",cursor:"pointer"}}>Event veröffentlichen</button>
        </div>
      </div>
    );

    /* ANGELINA: PROFIL */
    if(screen==="profil-a") return(
      <div style={{flex:1,overflowY:"auto"}}>
        <AppHdr persona="angelina" onFab={()=>go("a-create-1")} onNotif={()=>{}} onMsg={()=>go("k-messages")} subLabel="Community A" onSubLabel={()=>go("a-community")} onInfo={infoAct}/>
        <div style={{padding:"10px 14px 80px"}}>
          <div style={{background:WH,borderRadius:14,padding:"14px",marginBottom:10,display:"flex",gap:14,alignItems:"flex-start"}}>
            <div style={{width:52,height:52,borderRadius:"50%",background:`linear-gradient(135deg,${CC},${RC})`,flexShrink:0}}/>
            <div><p style={{fontWeight:700,fontSize:16,color:"#111",margin:0}}>Angelina</p><p style={{fontSize:11,color:"#888",margin:"2px 0 6px"}}>Community A · Gründerin</p><p style={{fontSize:11,color:"#666",lineHeight:1.5,margin:0}}>Organisiert Community A seit 2022. Glaubt, dass Sport Menschen verbindet.</p></div>
          </div>
          {/* Kundenkarte */}
          <button onClick={()=>go("n-wallet")} style={{width:"100%",textAlign:"left",background:HL,borderRadius:18,padding:"16px 14px",marginBottom:12,border:"none",cursor:"pointer",boxSizing:"border-box"}}>
            <p style={{fontSize:11,fontWeight:700,color:"rgba(0,0,0,0.5)",margin:"0 0 2px"}}>Kundenkarte</p>
            <p style={{fontSize:22,fontWeight:800,color:"#111",margin:"0 0 1px"}}>312 Karma</p>
            <p style={{fontSize:12,color:"rgba(0,0,0,0.55)",margin:"0 0 10px"}}>156,00 € Rabatt verfügbar</p>
            <p style={{fontSize:11,color:"rgba(0,0,0,0.4)",margin:0,textAlign:"right"}}>Tippen für Barcode →</p>
          </button>
          {/* Badges */}
          <Sec label="Badges"/>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            {[{l:"Gründerin",I:PplI,on:true},{l:"10 Events",I:CalI,on:true},{l:"50 Tasks",I:ChkI,on:false}].map(b=>(
              <div key={b.l} style={{flex:1,background:b.on?HL:"#e8e8e8",borderRadius:12,padding:"12px 6px 8px",textAlign:"center",opacity:b.on?1:0.45}}>
                <div style={{display:"flex",justifyContent:"center",marginBottom:5}}><b.I sz={22} c={b.on?"#111":"#888"}/></div>
                <p style={{fontSize:9,color:b.on?"#111":"#888",margin:0,fontWeight:600,lineHeight:1.3}}>{b.l}</p>
              </div>
            ))}
          </div>
          <Sec label="Meine Events"/>
          {A_EVENTS.map(e=>(
            <button key={e.id} onClick={()=>go("a-event-status")} style={{width:"100%",textAlign:"left",background:WH,borderRadius:14,padding:"12px 14px",marginBottom:8,border:"none",cursor:"pointer",boxSizing:"border-box"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:e.retailer?RC:CC}}>{e.sport} · {e.recurring}</span>
                {e.retailer?<span style={{fontSize:9,fontWeight:700,background:HL,borderRadius:20,padding:"1px 7px",color:"#111"}}>Karma</span>:<span style={{fontSize:9,color:"#aaa"}}>Community</span>}
              </div>
              <p style={{fontWeight:600,fontSize:13,color:"#111",margin:"0 0 2px"}}>{e.title}</p>
              <p style={{fontSize:11,color:"#888",margin:0}}>{e.location} · {e.date}</p>
            </button>
          ))}
        </div>
      </div>
    );

    /* ANGELINA: EVENT-STATUS */
    if(screen==="a-event-status") return(
      <div style={{flex:1,overflowY:"auto"}}>
        <AppHdr persona="angelina" onBack={()=>go("profil-a")} onNotif={()=>{}} canCreate={false} onInfo={infoAct} onMsg={()=>go("k-messages")}/>
        <EventDetailHdr e={A_EVENTS[0]}/>
        <div style={{padding:"8px 14px 100px"}}>
          <Sec label="Task-Status"/>
          <div style={{background:WH,borderRadius:14,overflow:"hidden"}}>
            {TMPLS_A.map((t,i,arr)=>(
              <div key={t.id} style={{display:"flex",alignItems:"center",padding:"11px 14px",borderBottom:i<arr.length-1?"1px solid #eee":"none",gap:8}}>
                <p style={{flex:1,fontSize:13,color:"#111",margin:0}}>{t.label}</p>
                <span style={{fontSize:10,background:"#f0f0f0",color:"#888",borderRadius:20,padding:"2px 8px"}}>Offen</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    );

    /* ANGELINA: COMMUNITY */
    if(screen==="a-community") return(
      <div style={{flex:1,overflowY:"auto"}}>
        <AppHdr persona="angelina" onBack={()=>go("profil-a")} onNotif={()=>{}} canCreate={false} onInfo={infoAct} onMsg={()=>go("k-messages")}/>
        <div style={{padding:"10px 14px 80px"}}>
          <PhotoBanner color={CC} label="Community A" h={110}/>
          <p style={{fontWeight:700,fontSize:18,color:"#111",margin:"0 0 2px"}}>Community A</p>
          <p style={{fontSize:11,color:"#888",margin:"0 0 10px"}}>Gegründet von Angelina · Feldkirch · seit 2022</p>
          <div style={{display:"flex",gap:16,padding:"10px 0",borderTop:"1px solid #bbb",borderBottom:"1px solid #bbb",marginBottom:10}}>
            {[["27","Mitglieder"],["12","Events"]].map(([v,l])=>(
              <div key={l}><p style={{fontWeight:700,fontSize:16,color:"#111",margin:0}}>{v}</p><p style={{fontSize:9,color:"#888",margin:"1px 0 0"}}>{l}</p></div>
            ))}
          </div>
          <Sec label="Sportarten"/>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
            {["Laufen","Gravel","Trailrunning","Hike"].map(s=>(
              <span key={s} style={{border:`1px solid ${CC}`,borderRadius:20,padding:"3px 10px",fontSize:11,color:CC,fontWeight:500}}>{s}</span>
            ))}
          </div>
          <Sec label="Mitglieder"/>
          <div style={{background:WH,borderRadius:14,overflow:"hidden"}}>
            {[{n:"Angelina",role:"Gründerin",k:312},{n:"Sarah W.",role:"Mitglied",k:28},{n:"Sara M.",role:"Mitglied",k:10},{n:"Patrick K.",role:"Mitglied",k:16}].map((m,i,arr)=>(
              <div key={m.n} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",borderBottom:i<arr.length-1?"1px solid #eee":"none"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:28,height:28,borderRadius:"50%",background:`linear-gradient(135deg,${CC},${RC})`}}/>
                  <div><p style={{fontSize:13,fontWeight:500,color:"#111",margin:0}}>{m.n}</p><p style={{fontSize:10,color:m.role==="Gründerin"?CC:"#aaa",margin:"1px 0 0",fontWeight:m.role==="Gründerin"?600:400}}>{m.role}</p></div>
                </div>
                <span style={{fontSize:11,color:"#999"}}>{m.k} Karma</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    );

    return null;
  }

  /* ── LAYOUT ─────────────────────────────────────────────────────────────── */
  // Target: MacBook 13.6" → ~1280×832 logical px
  // Left 1/3 (~426px): nav panel | Right 2/3 (~854px): device centered

  const isKontrolle = persona==="kuno" && screen==="k-manage";

  return(
    <div style={{height:"100vh",background:"#b0b0b0",display:"flex",overflow:"hidden",fontFamily:"'DM Sans',system-ui,sans-serif"}}>


      {/* ── LEFT NAV PANEL — 1/3 width ── */}
      <div style={{width:"33.333%",height:"100vh",overflowY:"auto",background:"#bbb",padding:"20px 18px",flexShrink:0}}>

        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:"#777"}}>ananda · Mid-Fi</span>
          <span style={{fontSize:10,color:"#999",fontWeight:500}}>RtD · FF2</span>
        </div>

        {/* Persona switcher */}
        <div style={{display:"flex",borderRadius:10,overflow:"hidden",border:"1px solid #999",background:WH,marginBottom:16}}>
          {["nora","kuno","angelina"].map((p,i)=>(
            <button key={p} onClick={()=>swP(p)} style={{flex:1,padding:"9px 0",fontSize:12,fontWeight:700,border:"none",cursor:"pointer",borderRight:i<2?"1px solid #ccc":"none",background:persona===p?"#111":WH,color:persona===p?WH:"#999",transition:"background .15s"}}>
              {p[0].toUpperCase()+p.slice(1)}
            </button>
          ))}
        </div>

        {/* Step navigation with groups */}
        {(()=>{
          const groups=[]; let lastG=null;
          steps.forEach((s,i)=>{
            if(s.g!==lastG){groups.push({g:s.g,steps:[]});lastG=s.g;}
            groups[groups.length-1].steps.push({...s,_i:i});
          });
          return groups.map((grp,gi)=>{
            const isKG = isKontrolle && grp.g.includes("Kontrolle");
            return(
              <div key={gi} style={{marginBottom:10}}>
                <p style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:"#999",margin:"0 0 5px"}}>{grp.g}</p>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                  {grp.steps.map((s)=>{
                    const realTarget=s.target||s.id;
                    const isCurr=(screen===realTarget)||(s.id===screen&&!s.alias&&!s.target);
                    const isDone=s._i<currStep;
                    return(
                      <button key={s.alias||s.id+s._i} onClick={()=>go(realTarget)}
                        style={{padding:"5px 9px",borderRadius:7,fontSize:11,fontWeight:600,border:"none",cursor:"pointer",whiteSpace:"nowrap",
                          background:isCurr?"#111":isDone?"#999":WH,
                          color:isCurr||isDone?WH:"#aaa"}}>
                        {s.l}
                      </button>
                    );
                  })}
                </div>
                {/* Kontrolle A/B/C no longer shown inline - each is its own step */}
              </div>
            );
          });
        })()}
      </div>

      {/* ── RIGHT DEVICE AREA — 2/3 width, device centered ── */}
      <div style={{flex:1,height:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{width:340,height:710,borderRadius:40,border:"7px solid #1a1a1a",background:BG,overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 20px 50px rgba(0,0,0,0.45)",position:"relative",flexShrink:0}}>
          {/* Status bar */}
          <div style={{padding:"5px 22px 0",background:BG,flexShrink:0}}>
            <span style={{fontSize:11,fontWeight:700,color:"#333"}}>9:41</span>
          </div>
          {/* Screen content */}
          <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>{renderContent()}</div>
          {/* Floating bottom nav */}
          <div style={{position:"absolute",bottom:58,left:0,right:0,display:"flex",justifyContent:"center",pointerEvents:"none"}}>
            <div style={{pointerEvents:"all",display:"inline-flex",background:"#111",borderRadius:22,padding:"3px",boxShadow:"0 4px 20px rgba(0,0,0,0.35)"}}>
              {NAV.map(t=>{
                const active=aBot===t.id;
                return(
                  <button key={t.id} onClick={t.fn} style={{padding:"9px 13px",border:"none",cursor:"pointer",borderRadius:18,background:active?HL:"transparent",color:active?"#111":WH,fontSize:12,fontWeight:700,whiteSpace:"nowrap"}}>
                    {t.label}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AnandaPrototype/>);
</script>
</body>
</html>
